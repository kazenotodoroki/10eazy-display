<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Niveau sonore</title>
<style>
:root{
  --bg:#0a0a0b; --fg:#f4f4f5; --mute:#71717a; --line:#27272a;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --c:var(--mute);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden;
}
body.ok{--c:var(--ok)} body.warn{--c:var(--warn)} body.bad{--c:var(--bad)}
body::before{ /* halo de couleur discret */
  content:"";position:fixed;inset:0;pointer-events:none;transition:opacity .8s,background .8s;
  background:radial-gradient(ellipse at 30% 50%,var(--c),transparent 60%);opacity:.08;
}
body.alarm::before{background:#b91c1c;opacity:1;transition:none;animation:flash 1s steps(1,end) infinite}
@keyframes flash{50%{opacity:0}}
body.alarm .big .val,body.alarm .unit,body.alarm .label,body.alarm .sub{color:#fff}

header{display:flex;align-items:center;gap:12px;padding:18px 28px;color:var(--mute);font-size:14px;transition:opacity .4s;z-index:1}
body.idle header{opacity:0}
body.idle{cursor:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sp{flex:1}
button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer;transition:.2s}
button:hover{color:var(--fg);border-color:var(--mute)}

main{flex:1;display:grid;grid-template-columns:1.35fr 1fr;align-items:center;gap:4vw;padding:0 5vw;z-index:1}
.label{font-size:clamp(13px,1.4vw,20px);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:.6em}
.val{font-weight:600;line-height:.95;letter-spacing:-.045em;white-space:nowrap}
.big .val{font-size:clamp(90px,17vw,340px);color:var(--c);transition:color .8s}
.small .val{font-size:clamp(60px,9vw,190px);color:var(--fg)}
.unit{font-size:.22em;font-weight:400;color:var(--mute);letter-spacing:0;margin-left:.15em}
#extra{white-space:pre}
main,footer{transition:opacity .4s}
body.stale main,body.stale footer{opacity:.25}
.lost{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  background:#18181b;border:1px solid var(--line);border-radius:14px;padding:18px 26px;font-size:clamp(15px,1.6vw,22px)}
body.stale .lost{display:block}
.sub{color:var(--mute);font-size:clamp(13px,1.2vw,17px);margin-top:1em;min-height:1.3em}

footer{padding:0 28px 26px;z-index:1}
canvas{width:100%;height:16vh;display:block}

@media (max-width:760px){
  main{grid-template-columns:1fr;gap:6vh;padding:0 16px}
  header{padding:12px 16px;flex-wrap:wrap;gap:8px;font-size:12px}
  header button{padding:5px 10px}
  #status{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  footer{padding:0 16px 16px}
}

dialog{background:#18181b;color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
dialog h2{font-size:18px;font-weight:600;margin-bottom:6px}
dialog p{color:var(--mute);font-size:14px;margin-bottom:18px;line-height:1.45}
dialog input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;outline:none}
dialog input:focus{border-color:var(--mute)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.primary:hover{background:#fff;color:#000}
/* vidéo anti-veille : plein écran, même couleur que le fond, derrière tout.
   Chrome Android ignore les vidéos minuscules ou masquées. */
#nosleep{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:-1;pointer-events:none;background:var(--bg)}
.awake{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.awake.on{color:var(--ok);border-color:rgba(34,197,94,.35)}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <span id="status">Connexion…</span>
  <span class="sp"></span>
  <span class="awake" id="awake" title="Empêche la tablette de passer en veille">Veille : touchez l'écran</span>
  <button id="btnReset" title="Remettre la fenêtre de 15 min à zéro">Remise à zéro</button>
  <button id="btnSrc">Source</button>
  <button id="btnFs" title="Plein écran (F)">Plein écran</button>
</header>

<main>
  <section class="big">
    <div class="label">LAeq 15 min</div>
    <div class="val"><span id="leq">—</span><span class="unit">dB</span></div>
    <div class="sub" id="leqSub"></div>
  </section>
  <section class="small">
    <div class="label">LAeq 1 s</div>
    <div class="val"><span id="las">—</span><span class="unit">dB</span></div>
    <div class="sub" id="extra">&nbsp;</div>
  </section>
</main>

<footer><canvas id="chart"></canvas></footer>
<div class="lost" id="lost">Plus de données de 10EaZy</div>
<video id="nosleep" muted playsinline loop preload="auto" src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAANSbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAF3AAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAnx0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAF3AAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAACAAAAAgAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAABdwAAAAAAABAAAAAAH0bWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAABAAAABgABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABn21pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAV9zdGJsAAAAt3N0c2QAAAAAAAAAAQAAAKdhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAACAAIABIAAAASAAAAAAAAAABFUxhdmM2MC4zMS4xMDIgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAALWF2Y0MBQsAK/+EAFmdCwAraJbARAAADAAEAAAMABA8SJqABAARozg/IAAAAEHBhc3AAAAABAAAAAQAAABRidHJ0AAAAAAAAA/EAAAPxAAAAGHN0dHMAAAAAAAAAAQAAAAwAACAAAAAAFHN0c3MAAAAAAAAAAQAAAAEAAAAcc3RzYwAAAAAAAAABAAAAAQAAAAwAAAABAAAARHN0c3oAAAAAAAAAAAAAAAwAAAKHAAAACgAAAAoAAAAKAAAACgAAAAoAAAAKAAAACgAAAAoAAAAKAAAACgAAAAoAAAAUc3RjbwAAAAAAAAABAAADggAAAGJ1ZHRhAAAAWm1ldGEAAAAAAAAAIWhkbHIAAAAAAAAAAG1kaXJhcHBsAAAAAAAAAAAAAAAALWlsc3QAAAAlqXRvbwAAAB1kYXRhAAAAAQAAAABMYXZmNjAuMTYuMTAwAAAACGZyZWUAAAL9bWRhdAAAAm8GBf//a9xF6b3m2Ui3lizYINkj7u94MjY0IC0gY29yZSAxNjQgcjMxMDggMzFlMTlmOSAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMjMgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWwgLSBvcHRpb25zOiBjYWJhYz0wIHJlZj0xIGRlYmxvY2s9MTowOjAgYW5hbHlzZT0weDE6MHgxMTEgbWU9aGV4IHN1Ym1lPTIgcHN5PTEgcHN5X3JkPTEuMDA6MC4wMCBtaXhlZF9yZWY9MCBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTAgOHg4ZGN0PTAgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9MCB0aHJlYWRzPTEgbG9va2FoZWFkX3RocmVhZHM9MSBzbGljZWRfdGhyZWFkcz0wIG5yPTAgZGVjaW1hdGU9MSBpbnRlcmxhY2VkPTAgYmx1cmF5X2NvbXBhdD0wIGNvbnN0cmFpbmVkX2ludHJhPTAgYmZyYW1lcz0wIHdlaWdodHA9MCBrZXlpbnQ9MjUwIGtleWludF9taW49MiBzY2VuZWN1dD00MCBpbnRyYV9yZWZyZXNoPTAgcmNfbG9va2FoZWFkPTE <dialog id="dlg">
  <form method="dialog">
    <h2>Source 10EaZy</h2>
    <p>Adresse IP du PC qui fait tourner 10EaZy. Ajoute <code>:port</code> si l'interface web n'est pas sur le port 80.</p>
    <input id="host" placeholder="192.168.40.221" autocomplete="off" spellcheck="false">
    <div class="row">
      <button value="cancel" formnovalidate>Annuler</button>
      <button value="ok" class="primary">Connecter</button>
    </div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const fmt = v => v == null ? '—' : v.toFixed(1).replace('.', ',');
const mmss = s => { s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const WINDOW = 900;
let hist = [], last = null, thresholds = [96, 100], askedOnce = false;

fetch('/api/history').then(r => r.json()).then(h => { hist = h; draw(); }).catch(() => {});

const es = new EventSource('/events');
es.onmessage = e => update(JSON.parse(e.data));
es.onerror = () => { $('#dot').className = 'dot'; $('#status').textContent = 'Serveur relais injoignable'; };

function update(s) {
  last = s; thresholds = s.thresholds || thresholds;
  $('#leq').textContent = fmt(s.laeq15);
  $('#las').textContent = fmt(s.las);
  document.body.classList.remove('ok', 'warn', 'bad', 'alarm', 'stale');
  if (s.level) document.body.classList.add(s.level);
  if (s.alarm) document.body.classList.add('alarm');
  const stale = !s.demo && !!s.host && !s.connected;
  document.body.classList.toggle('stale', stale);
  if (stale) $('#lost').textContent = 'Plus de données de 10EaZy' + (s.error ? ' — ' + s.error : '');

  $('#dot').className = 'dot' + (s.connected ? ' on' : '');
  $('#status').textContent =
    s.demo ? 'Démo (temps accéléré)' :
    !s.host ? 'Aucune source' :
    s.connected ? '10EaZy · ' + s.host :
    'Pas de données · ' + s.host + (s.error ? ' — ' + s.error : '');

  const x = s.extra || {};
  const f1 = v => v == null ? '—' : v.toFixed(1).replace('.', ',');
  $('#extra').textContent = 'LAeq 60 · ' + f1(x.laeq_60) + '   ·   LCeq 15 · ' + f1(x.lceq_15);
  $('#leqSub').textContent =
    s.over_s > 0 ? 'Au-dessus de ' + thresholds[1] + ' dB depuis ' + mmss(s.over_s) :
    s.laeq15 != null && s.window_s < WINDOW - 2 ? 'Fenêtre partielle · ' + mmss(s.window_s) + ' / 15:00' : '';

  if (s.las != null && (!hist.length || s.t - hist[hist.length - 1][0] >= 0.9)) hist.push([s.t, s.las]);
  while (hist.length && hist[0][0] < s.t - WINDOW) hist.shift();
  draw();

  if (!s.host && !s.demo && !askedOnce) { askedOnce = true; openSrc(); }
}

/* Graphique LAS sur 15 min */
const cv = $('#chart'), ctx = cv.getContext('2d');
function draw() {
  const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const vals = hist.map(h => h[1]).concat(thresholds);
  const lo = Math.min(85, Math.floor(Math.min(...vals) - 3)), hi = Math.max(110, Math.ceil(Math.max(...vals) + 3));
  const y = v => h - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo) * h;
  const now = last ? last.t : (hist.length ? hist[hist.length - 1][0] : 0);
  const x = t => w - (now - t) / WINDOW * w;
  const css = getComputedStyle(document.body);

  [[thresholds[0], css.getPropertyValue('--warn')], [thresholds[1], css.getPropertyValue('--bad')]].forEach(([v, c]) => {
    ctx.strokeStyle = c; ctx.globalAlpha = .45; ctx.setLineDash([4, 6]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y(v)); ctx.lineTo(w, y(v)); ctx.stroke();
  });
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  if (hist.length < 2) return;

  ctx.beginPath();
  hist.forEach(([t, v], i) => i ? ctx.lineTo(x(t), y(v)) : ctx.moveTo(x(t), y(v)));
  ctx.strokeStyle = '#a1a1aa'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.lineTo(x(hist[hist.length - 1][0]), h); ctx.lineTo(x(hist[0][0]), h); ctx.closePath();
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, 'rgba(161,161,170,.18)'); g.addColorStop(1, 'rgba(161,161,170,0)');
  ctx.fillStyle = g; ctx.fill();
}
addEventListener('resize', draw);

/* Source */
function openSrc() {
  try { $('#host').value = (last && last.host) || localStorage.getItem('host10e') || ''; } catch (e) {}
  $('#dlg').showModal();
}
$('#btnSrc').onclick = openSrc;
$('#dlg').addEventListener('close', () => {
  if ($('#dlg').returnValue !== 'ok') return;
  const host = $('#host').value.trim();
  try { localStorage.setItem('host10e', host); } catch (e) {}
  hist = []; draw();
  fetch('/api/config', { method: 'POST', body: JSON.stringify({ host }) });
});
$('#btnReset').onclick = () => {
  if (!confirm('Remettre le LAeq 15 min à zéro ?')) return;
  hist = []; draw(); fetch('/api/reset', { method: 'POST' });
};

/* Plein écran */
function toggleFs() {
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
}
$('#btnFs').onclick = toggleFs;
addEventListener('keydown', e => {
  if ($('#dlg').open) return;
  if (e.key === 'f' || e.key === 'F') toggleFs();
});
document.addEventListener('fullscreenchange', () => $('#btnFs').textContent = document.fullscreenElement ? 'Quitter' : 'Plein écran');

/* Barre du haut masquée après 3 s d'inactivité */
let idleT;
const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!$('#dlg').open) document.body.classList.add('idle'); }, 3000); };
['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, wake));
wake();

/* Empêcher la mise en veille (tablette/téléphone).
   1) Wake Lock API si dispo (HTTPS ou localhost uniquement)
   2) sinon vidéo muette en boucle (marche en http://IP sur iOS et Android) */
let lock = null;
const vid = $('#nosleep');
function setAwake(on, how) {
  const el = $('#awake');
  el.classList.toggle('on', on);
  el.textContent = on ? 'Veille bloquée' : "Veille : touchez l'écran";
  el.title = on ? 'Écran maintenu allumé (' + how + ')' : 'Touchez une fois l\'écran pour empêcher la mise en veille';
}
async function keepAwake() {
  if (document.visibilityState !== 'visible') return;
  if ('wakeLock' in navigator && window.isSecureContext) {
    try {
      if (!lock) {
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { lock = null; setAwake(false); });
      }
      setAwake(true, 'Wake Lock');
      return;
    } catch (e) { /* on tente la vidéo */ }
  }
  try { await vid.play(); setAwake(true, 'vidéo'); } catch (e) { setAwake(false); }
}
vid.addEventListener('pause', () => { if (!lock) setAwake(false); });
document.addEventListener('visibilitychange', keepAwake);
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => addEventListener(ev, keepAwake, { passive: true }));
setInterval(keepAwake, 30000);
keepAwake();
</script>
</body>
</html>
